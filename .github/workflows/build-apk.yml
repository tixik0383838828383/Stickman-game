name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          rm -rf www && mkdir www
          cp index.html www/
          cp -r css js assets www/

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          pip install --quiet pillow
          python3 tools/make_icons.py android/app/src/main/res

      - name: Landscape + fullscreen
        run: |
          python3 - <<'PY'
          import re, glob
          m = 'android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          t, n = re.subn(r'<activity\b', '<activity android:screenOrientation="sensorLandscape"', t, count=1)
          assert n == 1, 'manifest: <activity> not found'
          open(m, 'w').write(t)
          for s in glob.glob('android/app/src/main/res/values/styles.xml'):
              t = open(s).read()
              t, n = re.subn(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', r'\1\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>', t, count=1)
              print('styles patched:', n)
              open(s, 'w').write(t)
          PY
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml || true
          grep -n windowFullscreen android/app/src/main/res/values/styles.xml || true

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Stickman-Paper-Parkour.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stickman-Paper-Parkour-apk
          path: Stickman-Paper-Parkour.apk
